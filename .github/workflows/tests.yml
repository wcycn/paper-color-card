name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gtk-x11:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      GDK_BACKEND: x11
      GSETTINGS_BACKEND: memory
      NO_AT_BRIDGE: '1'
      GIO_USE_VFS: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi python3-gi-cairo gir1.2-gtk-3.0 librsvg2-common python3-venv xvfb xauth dbus-x11 libxtst6 fonts-noto-cjk
          /usr/bin/python3 -m venv --system-site-packages .venv
          .venv/bin/python -m pip install -r requirements.txt
      - name: Unit tests
        run: .venv/bin/python -B -m unittest -v test_palette_core test_markdown_core
      - name: Native GTK interaction tests on Xvfb
        run: |
          dbus-run-session --config-file=tests/session.conf -- \
            xvfb-run -a -s '-screen 0 1280x900x24' .venv/bin/python -B check_desktop.py
